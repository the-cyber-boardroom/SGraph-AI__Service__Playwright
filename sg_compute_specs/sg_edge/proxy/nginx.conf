# ═══════════════════════════════════════════════════════════════════════════════
# SG/Edge — OpenResty static-diagnostic rig (Phase 1)
# Plain HTTP on :80 (TLS terminates at CloudFront; the wildcard key never leaves
# AWS). No upstream proxying yet — any host is served a local diagnostic page
# (the Phase 1 "static-site short-circuit"). The /_edge/* endpoints expose the
# control-plane surfaces the Edge Waker (health probe) and Vault Reaper
# (slug_seen) rely on. Access log omits the client IP (redaction at source).
# The SAME config is mounted by the EC2 user-data and by the local docker-compose
# stack, so behaviour is identical in dev and prod.
# ═══════════════════════════════════════════════════════════════════════════════

env EDGE_INSTANCE_ID;
env EDGE_VERSION;

worker_processes  auto;
error_log         /dev/stderr  info;
pid               /var/run/openresty.pid;

events { worker_connections 1024; }

http {
    # access log omits the client-IP variable — never persisted (brief 01/02)
    log_format edge_redacted escape=json
        '{"time":"$time_iso8601","method":"$request_method","host":"$host",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"slug":"$http_x_sg_slug","upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout edge_redacted;

    lua_shared_dict slug_seen 20m;                                                    # per-slug last-seen ts (Reaper liveness source)
    lua_shared_dict metrics   5m;                                                     # per-proxy counters

    server {
        listen      80 default_server;
        server_name _;

        location = /_edge/health {                                                   # Edge Waker polls this for readiness
            default_type application/json;
            content_by_lua_block {
                ngx.say(string.format('{"status":"ok","instance":"%s","ts":%d}',
                        os.getenv("EDGE_INSTANCE_ID") or "", ngx.time()))
            }
        }

        location = /_edge/version {
            default_type application/json;
            content_by_lua_block {
                ngx.say(string.format('{"version":"%s"}', os.getenv("EDGE_VERSION") or "dev"))
            }
        }

        location = /_edge/stats {                                                    # scraped on demand (no CloudWatch agent in MVP)
            default_type application/json;
            content_by_lua_block {
                ngx.say(string.format('{"requests":%d}', ngx.shared.metrics:get("requests") or 0))
            }
        }

        location = /_edge/slug_seen {                                                # unioned by the Vault Reaper across the fleet
            default_type application/json;
            content_by_lua_block {
                local s     = ngx.shared.slug_seen
                local parts = {}
                for _, k in ipairs(s:get_keys(0)) do
                    parts[#parts + 1] = string.format('"%s":%d', k, s:get(k) or 0)
                end
                ngx.say("{" .. table.concat(parts, ",") .. "}")
            }
        }

        location / {                                                                 # Phase 1 static-site short-circuit
            default_type text/html;
            content_by_lua_block {
                local slug = ngx.var.http_x_sg_slug or ""
                if slug ~= "" then ngx.shared.slug_seen:set(slug, ngx.time()) end
                ngx.shared.metrics:incr("requests", 1, 0)
                ngx.say(string.format(
                    '<!doctype html><meta charset="utf-8"><title>SG/Edge</title>' ..
                    '<h1>SG/Edge proxy</h1><ul>' ..
                    '<li>instance: %s</li><li>host: %s</li>' ..
                    '<li>slug: %s</li><li>ts: %d</li></ul>',
                    os.getenv("EDGE_INSTANCE_ID") or "", ngx.var.host, slug, ngx.time()))
            }
        }
    }
}
