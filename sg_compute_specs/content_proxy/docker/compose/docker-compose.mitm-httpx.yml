# Merge it after the main compose:
#   docker compose -f docker-compose.yml -f docker-compose.mitm-httpx.yml up -d --build
# or simply:  sg content-proxy local up --fix-mitm-httpx
# Remove once diniscruz/mgraph-ai-service-mitmproxy ships with httpx.
# ─────────────────────────────────────────────────────────────────────────────
services:
  mitm-service:
    build:
      context: ./overrides/mitm-httpx
    image: cp-mitm-service-httpx:local
