services:
  mitm-service:
    image: diniscruz/mgraph-ai-service-mitmproxy
    container_name: cp-mitm-service
    environment:
      - FAST_API__AUTH__API_KEY__NAME=${FASTAPI_API_KEY_NAME}
      - FAST_API__AUTH__API_KEY__VALUE=${FASTAPI_API_KEY_VALUE}
      - AWS_ACCOUNT_ID
      - AWS_DEFAULT_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - CACHE__SERVICE__BUCKET_NAME
    networks:
      - cp-net
    restart: unless-stopped

  mitmproxy-int:
    image: mitmproxy/mitmproxy:12.2.3
    container_name: cp-mitmproxy-int
    command:
      - mitmweb
      - --web-host=0.0.0.0
      - --web-port=8081
      - --listen-host=0.0.0.0
      - --listen-port=8080
      - --scripts=/interceptors/active.py
    environment:
      - FASTAPI_BASE_URL=http://mitm-service:10011
      - FASTAPI_API_KEY_NAME=${FASTAPI_API_KEY_NAME}
      - FASTAPI_API_KEY_VALUE=${FASTAPI_API_KEY_VALUE}
    volumes:
      - ../../interceptors:/interceptors:ro
      - ${CONTENT_PROXY__CA_DIR:-./certs}:/home/mitmproxy/.mitmproxy
    networks:
      - cp-net
    restart: unless-stopped
    depends_on:
      - mitm-service

  mitmproxy-ext:
    image: mitmproxy/mitmproxy:12.2.3
    container_name: cp-mitmproxy-ext
    command:
      - mitmweb
      - --web-host=0.0.0.0
      - --web-port=8081
      - --listen-host=0.0.0.0
      - --listen-port=8080
      - --scripts=/interceptors/active.py
      - --set
      - proxyauth=${CONTENT_PROXY__PROXYAUTH_USER}:${CONTENT_PROXY__PROXYAUTH_PASS}
    environment:
      - FASTAPI_BASE_URL=http://mitm-service:10011
      - FASTAPI_API_KEY_NAME=${FASTAPI_API_KEY_NAME}
      - FASTAPI_API_KEY_VALUE=${FASTAPI_API_KEY_VALUE}
    volumes:
      - ../../interceptors:/interceptors:ro
      - ${CONTENT_PROXY__CA_DIR:-./certs}:/home/mitmproxy/.mitmproxy
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - cp-net
    restart: unless-stopped
    depends_on:
      - mitm-service

  sg-playwright:
    image: diniscruz/sg-playwright
    container_name: cp-sg-playwright
    environment:
      - SG_PLAYWRIGHT__DEFAULT_PROXY_URL=http://mitmproxy-int:8080
      - IGNORE_HTTPS_ERRORS=true
      - FAST_API__AUTH__API_KEY__NAME=X-API-Key
      - FAST_API__AUTH__API_KEY__VALUE=${SGRAPH_SEND__ACCESS_TOKEN}
    networks:
      - cp-net
    restart: unless-stopped
    depends_on:
      - mitmproxy-int

  vault-app:
    image: diniscruz/sg-send-vault
    container_name: cp-vault-app
    command: ["python", "-m", "sg_overrides.serve_with_proxy"]
    environment:
      - FAST_API__REVERSE_PROXY__ROUTES=pw=http://sg-playwright:8000
      - SGRAPH_SEND__ACCESS_TOKEN=${SGRAPH_SEND__ACCESS_TOKEN}
      - SEND__STORAGE_MODE=${SEND__STORAGE_MODE:-memory}
    volumes:
      - ./overrides:/app/sg_overrides:ro
    ports:
      - "443:8080"
    networks:
      - cp-net
    restart: unless-stopped
    depends_on:
      - sg-playwright

networks:
  cp-net:
    driver: bridge
