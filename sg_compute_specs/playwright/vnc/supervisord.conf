; ═══════════════════════════════════════════════════════════════════════════════
; sg-playwright-vnc — process tree
; xvfb → openbox → x11vnc → novnc → fastapi (+ optional autostart-browser oneshot)
; Priorities order startup (lower first); autorestart keeps the desktop alive
; through browser crashes. Logs go to stdout/stderr so `docker logs` shows all
; five programs interleaved (no in-container log files to rotate).
; ═══════════════════════════════════════════════════════════════════════════════

[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openbox]
command=openbox
environment=DISPLAY=":99"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -localhost: VNC (:5900) is reachable only from inside the container — the ONLY
; way in is websockify below (:6080), which is what the edge gate fronts.
; -nopw: no VNC password; auth belongs to the edge (--edge-auth), matching /pw.
; -xrandr: let the client ask the server to resize the display (noVNC resize=remote)
;          instead of scaling a fixed 1920x1080 image — crisper rendering.
; -xkb: use the XKEYBOARD extension for keysym→keycode mapping. Without it,
;       x11vnc against a bare Xvfb (no real keyboard device) frequently drops all
;       typed input while the mouse still works — the "can't type in the browser"
;       symptom. -noxrecord/-noxdamage keep x11vnc off X extensions Xvfb lacks.
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -localhost -rfbport 5900 -nopw -xkb -xrandr -noxrecord -noxdamage -quiet
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --web serves the noVNC client (vnc.html); the same port proxies the websocket
; to x11vnc. Ubuntu's novnc package installs to /usr/share/novnc.
[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; the unchanged sg-playwright service — same module CMD as the base image ran
[program:fastapi]
command=python3 -m sg_compute_specs.playwright.core.fast_api.lambda_handler
directory=/app
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; oneshot: when SG_PLAYWRIGHT__AUTOSTART_BROWSER is set (content_proxy fleet),
; wait for :8000 then POST /desktop/browser so a headed browser is already open
; when the user connects to noVNC. Exits 0 either way (startsecs=0, no restart).
[program:autostart-browser]
command=/usr/local/bin/autostart-browser.sh
priority=60
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
