name: CI Pipeline (Base)

# ═══════════════════════════════════════════════════════════════════════════════
# Reusable base pipeline — called by ci-pipeline__{dev,main,prod}.yml.
#
# Jobs:
#   1. run-unit-tests              — pytest tests/ci + tests/unit (always)
#   2. increment-tag               — version bump (dev/main only)
#   3. build-and-push-playwright-image
#                                  — multi-arch image → Docker Hub
#                                    (diniscruz/sg-playwright). MANUAL ONLY —
#                                    runs only when force_image_rebuild=true
#                                    on workflow_dispatch. Push events no
#                                    longer auto-build/publish the image.
#
# The Playwright Lambda / ECR / S3-zip jobs were retired in v0.2.11 — the
# service now ships as a Docker Hub image only. See
# team/roles/architect/reviews/05/14/v0.2.6__playwright-deployment-simplification.md
#
# The Host Control ECR image was moved to its own workflow
# (.github/workflows/build-host-control-ecr.yml) on 2026-05-18 — also
# manual-only. The previous in-pipeline build/push job and its
# check-aws-credentials / detect-changes gates were removed from this file.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_call:
    inputs:
      git_branch:
        required: true
        type: string
      release_type:
        required: false
        type: string
        default: ""
      should_increment_tag:
        required: false
        type: boolean
        default: false
      target_deploy:
        required: true
        type: string
      force_image_rebuild:
        required: false
        type: boolean
        default: false                                                                  # Set true to rebuild + push the image even when no image-relevant files changed (base-image refresh, cache bust)
    secrets:
      DOCKERHUB_TOKEN:
        required: false                                                                 # Docker Hub PAT for the diniscruz namespace — needed to push the playwright image (manual builds only)

env:
  DOCKERHUB_USERNAME : 'diniscruz'
  IMAGE_NAME         : 'sg-playwright'
  REGISTRY_IMAGE     : 'diniscruz/sg-playwright'

permissions:
  contents: write
  id-token: write

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # Job 1: Unit Tests (no browser, no Docker)
  # ════════════════════════════════════════════════════════════════════════════
  run-unit-tests:
    name: "Run Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout build
          pip install -e .

      - name: Run CI guards
        timeout-minutes: 2
        run: python -m pytest tests/ci/ -v --timeout=30

      - name: Run unit tests
        timeout-minutes: 5
        run: python -m pytest tests/unit/ -v --timeout=30

  # ════════════════════════════════════════════════════════════════════════════
  # Job 2: Increment Tag (dev bumps minor, main bumps major; skipped on prod).
  #   Runs before the image build so the pushed image is tagged with the
  #   freshly-bumped version.
  # ════════════════════════════════════════════════════════════════════════════
  increment-tag:
    name: Increment Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [run-unit-tests]
    if: ${{ inputs.should_increment_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Increment Tag
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__increment-tag@dev
        with:
          release_type: ${{ inputs.release_type }}


  # ════════════════════════════════════════════════════════════════════════════
  # Job 3: Build Playwright Image — per-arch, on NATIVE runners (matrix)
  #   linux/amd64 builds on ubuntu-latest, linux/arm64 on ubuntu-24.04-arm.
  #   Each arch builds natively (no QEMU emulation — the slow path the single
  #   multi-arch job paid before) and pushes BY DIGEST only (no tag yet).
  #   Digests are handed to the merge job via artifacts.
  #
  #   MANUAL ONLY: gated on force_image_rebuild (workflow_dispatch input).
  #   Push triggers no longer auto-build/publish — set
  #   force_image_rebuild=true when running ci-pipeline__{dev,main,prod}.yml
  #   from the Actions UI to release a new image.
  # ════════════════════════════════════════════════════════════════════════════
  build-playwright-image:
    name: "Build Playwright Image (${{ matrix.platform }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    needs: [run-unit-tests, increment-tag]
    if: |
      always() &&
      needs.run-unit-tests.result == 'success' &&
      (needs.increment-tag.result == 'success' || needs.increment-tag.result == 'skipped') &&
      inputs.force_image_rebuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform : linux/amd64
            runner   : ubuntu-latest
            arch     : amd64
          - platform : linux/arm64
            runner   : ubuntu-24.04-arm
            arch     : arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_branch }}                                                 # Pick up the version-file bump pushed by increment-tag

      - name: Git Update Current Branch
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context     : .
          file        : sg_compute_specs/playwright/Dockerfile
          platforms   : ${{ matrix.platform }}
          cache-from  : type=gha,scope=${{ matrix.arch }}
          cache-to    : type=gha,scope=${{ matrix.arch }},mode=max
          outputs     : type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name              : digest-${{ matrix.arch }}
          path              : /tmp/digests/*
          if-no-files-found : error
          retention-days    : 1

  # ════════════════════════════════════════════════════════════════════════════
  # Job 3a-bis: Integration test the freshly-built image BEFORE tagging.
  #   Pulls the amd64 by-digest image (no tag exists yet) and runs the live
  #   HTTP suite (tests/integration_live/) against it. If any sentinel
  #   fails — BUG-1, BUG-2, FR-5a, /browser/* round-trip, /sequence/execute
  #   polymorphic preservation — the manifest push is skipped and `:latest`
  #   stays pinned to the previous good build. amd64 only by design: the
  #   image is functionally identical across arches; arm64 build correctness
  #   is verified by the build job's own success.
  # ════════════════════════════════════════════════════════════════════════════
  integration-test-image:
    name: "Integration test image (pre-tag, amd64)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-playwright-image]
    if: ${{ !cancelled() && needs.build-playwright-image.result == 'success' }}
    env:
      TEST_API_KEY_HEADER: 'X-API-Key'
      TEST_API_KEY_VALUE : 'ci-pretag-integration-key'
      CONTAINER_NAME     : 'sgpw-pretag-test'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test deps
        run: pip install pytest httpx pytest-timeout

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download amd64 digest
        uses: actions/download-artifact@v4
        with:
          name: digest-amd64
          path: /tmp/digests

      - name: Resolve by-digest image reference
        id: ref
        run: |
          digest_file=$(ls /tmp/digests | head -1)
          echo "image_ref=${{ env.REGISTRY_IMAGE }}@sha256:${digest_file}" >> $GITHUB_OUTPUT
          echo "Using: ${{ env.REGISTRY_IMAGE }}@sha256:${digest_file}"

      - name: Pull image
        run: docker pull "${{ steps.ref.outputs.image_ref }}"

      - name: Run image (background)
        run: |
          docker run -d \
            --name "$CONTAINER_NAME" \
            -p 8000:8000 \
            -e FAST_API__AUTH__API_KEY__NAME="$TEST_API_KEY_HEADER" \
            -e FAST_API__AUTH__API_KEY__VALUE="$TEST_API_KEY_VALUE" \
            "${{ steps.ref.outputs.image_ref }}"

      - name: Wait for /health/status ready
        run: |
          for i in $(seq 1 45); do
            if curl -sf -H "$TEST_API_KEY_HEADER: $TEST_API_KEY_VALUE" \
                 http://localhost:8000/health/status > /dev/null; then
              echo "Service ready after ${i}*2s"
              exit 0
            fi
            sleep 2
          done
          echo "Service never became reachable" >&2
          docker logs "$CONTAINER_NAME" --tail 200 || true
          exit 1

      - name: Preflight — runner + service liveness (cheap, no browser)
        env:
          SG_PLAYWRIGHT__LIVE_BASE_URL: http://localhost:8000
          SG_PLAYWRIGHT__LIVE_API_KEY : ${{ env.TEST_API_KEY_VALUE }}
          PYTHONPATH                  : '.'
        run: pytest tests/integration_live/test_00_preflight.py -v --timeout=60         # If preflight fails the rest can't pass — surface the right altitude in the CI log

      - name: Preflight container snapshot
        if: always()
        run: |
          echo "── container state after preflight ───────────────────────"
          docker ps -a --filter "name=$CONTAINER_NAME" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo "── last 100 lines of service log ─────────────────────────"
          docker logs "$CONTAINER_NAME" --tail 100 || true

      - name: Run remaining live integration suite
        env:
          SG_PLAYWRIGHT__LIVE_BASE_URL: http://localhost:8000
          SG_PLAYWRIGHT__LIVE_API_KEY : ${{ env.TEST_API_KEY_VALUE }}
          PYTHONPATH                  : '.'
        run: pytest tests/integration_live/ --ignore=tests/integration_live/test_00_preflight.py -v --timeout=90

      - name: Dump container logs on failure
        if: failure()
        run: docker logs "$CONTAINER_NAME" --tail 500 || true

      - name: Stop container
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true


  # ════════════════════════════════════════════════════════════════════════════
  # Job 3b: Merge per-arch digests into the published manifest list
  #   Combines the amd64 + arm64 digests into a single multi-arch manifest and
  #   tags it. Pushes two tags:
  #     diniscruz/sg-playwright:<version>   — immutable, version-pinned
  #     diniscruz/sg-playwright:latest      — floating
  #
  #   GATED on integration-test-image — a broken image never gets a tag. The
  #   by-digest layer pushed by Job 3 stays orphaned (no consumer can pull
  #   it without the exact sha256) and gets garbage-collected by Docker Hub.
  # ════════════════════════════════════════════════════════════════════════════
  push-playwright-manifest:
    name: "Push Playwright Image Manifest to Docker Hub"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-playwright-image, integration-test-image]
    if: ${{ !cancelled() && needs.build-playwright-image.result == 'success' && needs.integration-test-image.result == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_branch }}

      - name: Git Update Current Branch
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@dev

      - name: Read image version
        id: version
        run: echo "version=$(cat version)" >> $GITHUB_OUTPUT                            # repo-root version — auto-incremented by the increment-tag job; single source of truth

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path    : /tmp/digests
          pattern : digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create + push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY_IMAGE }}:${{ steps.version.outputs.version }} \
            --tag ${{ env.REGISTRY_IMAGE }}:latest \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.version.outputs.version }}

