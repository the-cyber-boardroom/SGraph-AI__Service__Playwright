name: CI Pipeline (Base)

# ═══════════════════════════════════════════════════════════════════════════════
# Reusable base pipeline — called by ci-pipeline__{dev,main,prod}.yml.
#
# Jobs:
#   1. run-unit-tests              — pytest tests/ci + tests/unit (always)
#   2. increment-tag               — version bump (dev/main only)
#   3. build-and-push-playwright-image
#                                  — multi-arch image → Docker Hub
#                                    (diniscruz/sg-playwright). MANUAL ONLY —
#                                    runs only when force_image_rebuild=true
#                                    on workflow_dispatch. Push events no
#                                    longer auto-build/publish the image.
#
# The Playwright Lambda / ECR / S3-zip jobs were retired in v0.2.11 — the
# service now ships as a Docker Hub image only. See
# team/roles/architect/reviews/05/14/v0.2.6__playwright-deployment-simplification.md
#
# The Host Control ECR image was moved to its own workflow
# (.github/workflows/build-host-control-ecr.yml) on 2026-05-18 — also
# manual-only. The previous in-pipeline build/push job and its
# check-aws-credentials / detect-changes gates were removed from this file.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_call:
    inputs:
      git_branch:
        required: true
        type: string
      release_type:
        required: false
        type: string
        default: ""
      should_increment_tag:
        required: false
        type: boolean
        default: false
      target_deploy:
        required: true
        type: string
      force_image_rebuild:
        required: false
        type: boolean
        default: false                                                                  # Set true to rebuild + push the image even when no image-relevant files changed (base-image refresh, cache bust)
    secrets:
      DOCKERHUB_TOKEN:
        required: false                                                                 # Docker Hub PAT for the diniscruz namespace — needed to push the playwright image (manual builds only)

env:
  DOCKERHUB_USERNAME : 'diniscruz'
  IMAGE_NAME         : 'sg-playwright'
  REGISTRY_IMAGE     : 'diniscruz/sg-playwright'

permissions:
  contents: write
  id-token: write

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # Job 1: Unit Tests (no browser, no Docker)
  # ════════════════════════════════════════════════════════════════════════════
  run-unit-tests:
    name: "Run Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout build
          pip install -e .

      - name: Run CI guards
        timeout-minutes: 2
        run: python -m pytest tests/ci/ -v --timeout=30

      - name: Run unit tests
        timeout-minutes: 5
        run: python -m pytest tests/unit/ -v --timeout=30

  # ════════════════════════════════════════════════════════════════════════════
  # Job 2: Increment Tag (dev bumps minor, main bumps major; skipped on prod).
  #   Runs before the image build so the pushed image is tagged with the
  #   freshly-bumped version.
  # ════════════════════════════════════════════════════════════════════════════
  increment-tag:
    name: Increment Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [run-unit-tests]
    if: ${{ inputs.should_increment_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Increment Tag
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__increment-tag@dev
        with:
          release_type: ${{ inputs.release_type }}


  # ════════════════════════════════════════════════════════════════════════════
  # Job 3a: Build amd64 image — push by digest (no integration test in this job)
  #   Per-arch native build (ubuntu-latest for amd64, ubuntu-24.04-arm for
  #   arm64). Each pushes BY DIGEST only — no tag yet. The manifest job
  #   combines digests after the integration tests pass.
  #
  #   MANUAL ONLY: gated on force_image_rebuild (workflow_dispatch input).
  # ════════════════════════════════════════════════════════════════════════════
  build-amd64:
    name: "Build amd64"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [run-unit-tests, increment-tag]
    if: |
      always() &&
      needs.run-unit-tests.result == 'success' &&
      (needs.increment-tag.result == 'success' || needs.increment-tag.result == 'skipped') &&
      inputs.force_image_rebuild
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_branch }}

      - name: Git Update Current Branch
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context     : .
          file        : sg_compute_specs/playwright/Dockerfile
          platforms   : linux/amd64
          cache-from  : type=gha,scope=amd64
          cache-to    : type=gha,scope=amd64,mode=max
          outputs     : type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name              : digest-amd64
          path              : /tmp/digests/*
          if-no-files-found : error
          retention-days    : 1

  # ════════════════════════════════════════════════════════════════════════════
  # Job 3b: Build arm64 — push by digest (runs in parallel with amd64)
  #   arm64 is functionally identical to amd64; the integration tests on
  #   amd64 are sufficient signal. Total wall-clock is max(build-amd64,
  #   build-arm64) + integration-test-image + push-manifest.
  # ════════════════════════════════════════════════════════════════════════════
  build-arm64:
    name: "Build arm64"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    needs: [run-unit-tests, increment-tag]
    if: |
      always() &&
      needs.run-unit-tests.result == 'success' &&
      (needs.increment-tag.result == 'success' || needs.increment-tag.result == 'skipped') &&
      inputs.force_image_rebuild
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_branch }}

      - name: Git Update Current Branch
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context     : .
          file        : sg_compute_specs/playwright/Dockerfile
          platforms   : linux/arm64
          cache-from  : type=gha,scope=arm64
          cache-to    : type=gha,scope=arm64,mode=max
          outputs     : type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name              : digest-arm64
          path              : /tmp/digests/*
          if-no-files-found : error
          retention-days    : 1

  # ════════════════════════════════════════════════════════════════════════════
  # Job 3b (REMOVED): integration-test-image
  #   Folded into build-and-test-amd64 above — no separate job, no registry
  #   pull, no artifact handoff. The pre-tag gate is now an inline step
  #   inside the amd64 build, which is what the user requested for faster
  #   feedback.
  # ════════════════════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════════════════════
  # Job 3c: Integration test the amd64 image — gates the manifest push
  #   Pulls the by-digest amd64 image (no tag yet), starts it with
  #   --shm-size=2g, waits for liveness, runs the preflight + remaining
  #   live suite. The container runs separately from the build to keep
  #   concerns isolated:
  #     • build-amd64 / build-arm64 only build + push by digest
  #     • integration-test-image only consumes the built image
  #     • push-playwright-manifest only tags + publishes
  #
  #   If any sentinel fails the manifest push is skipped → `:latest` stays
  #   pinned to the previous good build. The orphan by-digest layers from
  #   a failed run get GC'd by Docker Hub since no tag references them.
  # ════════════════════════════════════════════════════════════════════════════
  integration-test-image:
    name: "Integration test image (pre-tag, amd64)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-amd64]
    if: ${{ !cancelled() && needs.build-amd64.result == 'success' }}
    env:
      TEST_API_KEY_NAME : 'X-API-Key'
      TEST_API_KEY_VALUE: 'ci-pretag-integration-key'
      CONTAINER_NAME    : 'sgpw-pretag-test'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install integration test deps
        run: pip install pytest httpx pytest-timeout pytest-xdist                       # xdist parallelises the live tier; conftest pins serial-marked session tests onto one worker via xdist_group

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download amd64 digest
        uses: actions/download-artifact@v4
        with:
          name: digest-amd64
          path: /tmp/digests

      - name: Resolve by-digest image reference
        id: ref
        run: |
          digest_file=$(ls /tmp/digests | head -1)
          echo "image_ref=${{ env.REGISTRY_IMAGE }}@sha256:${digest_file}" >> $GITHUB_OUTPUT
          echo "Using: ${{ env.REGISTRY_IMAGE }}@sha256:${digest_file}"

      - name: Pull image
        run: docker pull "${{ steps.ref.outputs.image_ref }}"

      - name: Run image in background
        run: |
          docker run -d \
            --name "$CONTAINER_NAME" \
            -p 8000:8000 \
            --shm-size=2g \
            -e FAST_API__AUTH__API_KEY__NAME="$TEST_API_KEY_NAME" \
            -e FAST_API__AUTH__API_KEY__VALUE="$TEST_API_KEY_VALUE" \
            "${{ steps.ref.outputs.image_ref }}"

      - name: Wait for /health/info ready
        run: |
          for i in $(seq 1 45); do
            if curl -sf -H "$TEST_API_KEY_NAME: $TEST_API_KEY_VALUE" \
                 http://localhost:8000/health/info > /dev/null; then
              echo "Service ready after ${i}*2s"
              exit 0
            fi
            sleep 2
          done
          echo "Service never became reachable" >&2
          docker logs "$CONTAINER_NAME" --tail 200 || true
          exit 1

      - name: Preflight — runner + service liveness (cheap, no browser)
        env:
          SG_PLAYWRIGHT__LIVE_BASE_URL: http://localhost:8000
          SG_PLAYWRIGHT__LIVE_API_KEY : ${{ env.TEST_API_KEY_VALUE }}
          PYTHONPATH                  : '.'
        run: pytest tests/integration_live/test_00_preflight.py -v --timeout=60

      - name: Container snapshot after preflight
        if: always()
        run: |
          echo "── container state after preflight ───────────────────────"
          docker ps -a --filter "name=$CONTAINER_NAME" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo "── last 100 lines of service log ─────────────────────────"
          docker logs "$CONTAINER_NAME" --tail 100 || true

      - name: Run remaining live integration suite
        env:
          SG_PLAYWRIGHT__LIVE_BASE_URL: http://localhost:8000
          SG_PLAYWRIGHT__LIVE_API_KEY : ${{ env.TEST_API_KEY_VALUE }}
          PYTHONPATH                  : '.'
        run: pytest tests/integration_live/ --ignore=tests/integration_live/test_00_preflight.py --ignore=tests/integration_live/test_99_ui_console.py -v --timeout=90 -n 4 --dist loadgroup    # -n 4 = 4 xdist workers; loadgroup pins serial-marked session tests to one worker. test_99 runs serially in the dedicated console-gate step below.

      - name: UI console + Docker-image checks (gate the publish)                       # v0.2.64 brief 06 §5 — GET / + /health/capabilities + /pw-prefixed index + W1 against the by-digest image; a red check here blocks push-playwright-manifest
        env:
          SG_PLAYWRIGHT__LIVE_BASE_URL: http://localhost:8000
          SG_PLAYWRIGHT__LIVE_API_KEY : ${{ env.TEST_API_KEY_VALUE }}
          PYTHONPATH                  : '.'
        run: pytest tests/integration_live/test_99_ui_console.py -v --timeout=90        # numbered test_1..test_6 run top-down (deploy-via-pytest); serial — not sharded across xdist workers. test_6 = F4.2 in-image console render smoke (#builder geometry via get_dom_tree)

      - name: Container state + logs after suite
        if: always()
        run: |
          echo "── container state after suite ───────────────────────────"
          docker ps -a --filter "name=$CONTAINER_NAME" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo "── docker inspect (exit code / oom / restart count) ──────"
          docker inspect "$CONTAINER_NAME" --format 'Status: {{.State.Status}}  ExitCode: {{.State.ExitCode}}  OOMKilled: {{.State.OOMKilled}}  RestartCount: {{.RestartCount}}  Error: {{.State.Error}}' || true
          echo "── last 500 lines of service log ─────────────────────────"
          docker logs "$CONTAINER_NAME" --tail 500 2>&1 || true

      - name: Resource leak introspection                                           # Observability only — exits 0. Surfaces leaks visible in CI log before they hit EC2 long-running deployments.
        if: always()
        run: |
          set +e
          echo "── docker stats (cpu, mem, mem%) ────────────────────────"
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.PIDs}}' "$CONTAINER_NAME"
          echo ""
          echo "── orphan Chromium processes (should be 0 between requests) ─"
          chromium_count=$(docker exec "$CONTAINER_NAME" sh -c 'pgrep -fc -- chrome || true')
          echo "Chromium processes: ${chromium_count:-?}"
          if [ -n "$chromium_count" ] && [ "$chromium_count" -gt 0 ]; then
            echo "WARNING: $chromium_count Chromium process(es) still running after suite — potential leak"
            docker exec "$CONTAINER_NAME" sh -c 'ps -eo pid,ppid,etime,rss,cmd | grep -i chrom | head -20' || true
          fi
          echo ""
          echo "── zombie processes ─────────────────────────────────────"
          zombies=$(docker exec "$CONTAINER_NAME" sh -c "ps -eo stat,pid,cmd | awk '\$1 ~ /^Z/' | wc -l")
          echo "Zombie processes: ${zombies:-?}"
          [ "$zombies" -gt 0 ] && docker exec "$CONTAINER_NAME" sh -c "ps -eo stat,pid,cmd | awk '\$1 ~ /^Z/'" || true
          echo ""
          echo "── /dev/shm usage ───────────────────────────────────────"
          docker exec "$CONTAINER_NAME" df -h /dev/shm || true
          echo ""
          echo "── open file descriptors on service process ─────────────"
          docker exec "$CONTAINER_NAME" sh -c 'ls /proc/1/fd 2>/dev/null | wc -l' || true
          echo ""
          echo "── /metrics scrape (sample of Prometheus output) ────────"
          curl -sf -H "X-API-Key: $TEST_API_KEY_VALUE" http://localhost:8000/metrics 2>/dev/null | head -50 || echo "metrics unavailable"
          echo ""
          exit 0

      - name: Stop test container
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true

  # ════════════════════════════════════════════════════════════════════════════
  # Job 4: Merge per-arch digests into the published manifest list
  #   Combines the amd64 + arm64 digests into a single multi-arch manifest and
  #   tags it. Pushes two tags:
  #     diniscruz/sg-playwright:<version>   — immutable, version-pinned
  #     diniscruz/sg-playwright:latest      — floating
  #
  #   GATED on the amd64 job (which now includes integration tests) AND on
  #   the arm64 build job. A broken image never gets a tag — the orphaned
  #   by-digest layers from a failed amd64 build (and the parallel arm64
  #   build that succeeded) get GC'd by Docker Hub since no tag references
  #   them.
  # ════════════════════════════════════════════════════════════════════════════
  push-playwright-manifest:
    name: "Push Playwright Image Manifest to Docker Hub"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-amd64, build-arm64, integration-test-image]
    if: ${{ !cancelled() && needs.build-amd64.result == 'success' && needs.build-arm64.result == 'success' && needs.integration-test-image.result == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_branch }}

      - name: Git Update Current Branch
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@dev

      - name: Read image version
        id: version
        run: echo "version=$(cat version)" >> $GITHUB_OUTPUT                            # repo-root version — auto-incremented by the increment-tag job; single source of truth

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path    : /tmp/digests
          pattern : digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create + push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY_IMAGE }}:${{ steps.version.outputs.version }} \
            --tag ${{ env.REGISTRY_IMAGE }}:latest \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.version.outputs.version }}

